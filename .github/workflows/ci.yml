name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mail-backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: mail-backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck backend
        working-directory: mail-backend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test backend
        working-directory: mail-backend
        run: npm test

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend
        working-directory: mail-backend
        run: npm run build

      - name: Build Docker images
        run: docker compose build
