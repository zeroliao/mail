name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: file:./prisma/ci.db
      JWT_SECRET: ci-test-jwt-secret-1234567890
      TOKEN_ENCRYPTION_KEY: ci-test-token-encryption-key-123456
      API_ADMIN_USERNAME: admin
      API_ADMIN_PASSWORD: ci-test-admin-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mail-backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: mail-backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck backend
        working-directory: mail-backend
        run: npm run typecheck

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test backend
        working-directory: mail-backend
        run: npm test

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend
        working-directory: mail-backend
        run: npm run build

      - name: Build Docker images
        run: docker compose build

      - name: Smoke test backend production image
        shell: bash
        run: bash deploy/scripts/smoke-backend-image.sh mailops-backend:local
