name: GHCR Images

on:
  push:
    branches:
      - "release/**"
    paths:
      - ".github/workflows/ghcr-images.yml"
      - "frontend/**"
      - "mail-backend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.component }} candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: mail-backend
            context: ./mail-backend
            dockerfile: ./mail-backend/Dockerfile
            build_args: ""
          - component: frontend
            image: mail-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: VITE_API_BASE_URL=/api

    steps:
      - name: Require release branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != release/* ]]; then
            echo "Candidate images can only be built from release/<version>." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: build_meta
        shell: bash
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#release/}"
          short_sha="${GITHUB_SHA::7}"
          safe_version="$(echo "$version" | tr '[:upper:]/' '[:lower:]-' | sed -E 's/[^a-z0-9._-]+/-/g')"

          echo "image=ghcr.io/${owner_lower}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=release-${safe_version}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.build_meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.build_meta.outputs.candidate_tag }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Publish handoff
        shell: bash
        run: |
          image="${{ steps.build_meta.outputs.image }}"
          digest="${{ steps.build.outputs.digest }}"

          {
            echo "### ${{ matrix.component }} candidate published"
            echo
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Candidate tag: \`${image}:${{ steps.build_meta.outputs.candidate_tag }}\`"
            echo "- Immutable digest: \`${image}@${digest}\`"
            echo
            echo "Copy this digest into docs/releases/<version>.md and deploy/images.env."
          } >> "$GITHUB_STEP_SUMMARY"
