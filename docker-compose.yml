services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "5173:80"

  backend:
    build:
      context: ./mail-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/data/dev.db
    ports:
      - "3000:3000"
    volumes:
      - mail_data:/data

volumes:
  mail_data:
