services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/data/dev.db"
    ports:
      - "3000:3000"
    volumes:
      - mail_data:/data
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  mail_data:
